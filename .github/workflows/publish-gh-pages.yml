name: Deploy Sphinx documentation to Pages

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      # only engage the github-pages environment when we actually deploy (main),
      # so dev/PR build-check runs don't trip its deployment-branch protection
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          # full history + tags so setuptools-scm can derive the version
          fetch-depth: 0
      - name: Create conda environment
        uses: mamba-org/setup-micromamba@v3
        with:
          cache-environment: true
          environment-file: ci/environment.yml
      - name: Install editable climkern
        run: |
          python -m pip install --no-deps -e .
      - id: deployment
        uses: sphinx-notes/pages@v3
        with:
          documentation_path: ./docs/source
          # Treat warnings (e.g. autodoc failing to import the package) as
          # errors so a broken build fails instead of silently deploying
          # empty pages. --keep-going reports all warnings before failing.
          sphinx_build_options: -W --keep-going
          # build everywhere (catches breakage on dev/PRs), but only the
          # stable main branch publishes to the live site
          publish: ${{ github.ref == 'refs/heads/main' }}
