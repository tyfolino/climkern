[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "climkern"
dynamic = ["version"]
description = "Python package for easily computing climate feedbacks using radiative kernels."
readme = "README.md"
requires-python = ">= 3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ty Janoski", email="tyfolino@gmail.com"},
]
keywords = [
    "climate",
    "radiative kernels",
    "climate feedbacks",
    "climate science",
    "xarray",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "xarray>=0.16.2",
    "cf-xarray>=0.5.1",
    "cftime",
    "xesmf>=0.7.1",
    "fsspec[http]",
    "h5netcdf",
    "h5py",
    "pooch",
    "tqdm",
    "plac",
    "netCDF4",
]

[project.urls]
Homepage = "https://github.com/tyfolino/climkern"
Documentation = "https://tyfolino.github.io/climkern/"
Repository = "https://github.com/tyfolino/climkern"
Issues = "https://github.com/tyfolino/climkern/issues"

[project.optional-dependencies]
test = [
    "pytest>=7,<8",
]

lint = [
    "pre-commit>=3.5",
]

# Version is derived from git tags (no hardcoded number to bump)
[tool.setuptools_scm]
version_file = "climkern/_version.py"

# Explicit package discovery (flat layout)
[tool.setuptools.packages.find]
include = ["climkern*"]

# Ship type information (PEP 561) and the data registry (pooch hashes for the
# kernels/tutorial files streamed from Jetstream2) to downstream users.
[tool.setuptools.package-data]
climkern = ["py.typed", "registry.txt"]

# tools
# https://docs.astral.sh/ruff/ — Ruff handles both linting and formatting.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "E",      # style errors
    "F",      # flakes
    "D",      # pydocstyle
    "I001",   # isort
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "A001",   # flake8-builtins
    "NPY",    # NumPy-specific rules (incl. NumPy 2.0 migration)
    "RUF",    # ruff-specific rules
    "RUF100", # Unused noqa directive
]
extend-ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D103", # Missing docstring in public function
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary line and description
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D413", # Missing blank line after last section
    "D416", # Section name should end with a colon
    "D417", # Missing argument description (docstrings are not mandatory here)
    # Climate-science code uses domain-standard uppercase names (T, TS, SWup,
    # FSNT, ...). Allow them, consistent with the N806 exception below.
    "N802", # Function name should be lowercase
    "N803", # Argument name should be lowercase
    "N806", # Variable in function should be lowercase
    "N807", # Function name should not start/end with __ (private helpers)
]

[tool.ruff.lint.per-file-ignores]
# Sphinx requires the module-level `copyright` variable name.
"docs/source/conf.py" = ["A001"]

# Black-compatible defaults; declared explicitly for clarity.
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true  # xesmf ships no type stubs (xarray does)
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
